name = "civicresolve-api"
main = "src/platform/index.ts"
compatibility_date = "2026-07-28"
workers_dev = true

[vars]
APP_ENV = "development"
DEV_AUTH_ENABLED = "false"
AUTH0_DOMAIN = "dev-ole6i03kzvf3yb8z.us.auth0.com"
AUTH0_AUDIENCE = "https://civicresolve.example/api"

[env.production.vars]
APP_ENV = "production"
DEV_AUTH_ENABLED = "false"
AUTH0_DOMAIN = "dev-ole6i03kzvf3yb8z.us.auth0.com"
AUTH0_AUDIENCE = "https://civicresolve.example/api"

[[d1_databases]]
binding = "DB"
database_name = "civicresolve-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "PRIVATE_ASSETS"
bucket_name = "civicresolve-private-local"
