name = "civicresolve-api"
main = "src/platform/index.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[ai]
binding = "AI"

[vars]
APP_ENV = "development"
DEV_AUTH_ENABLED = "false"
AUTH0_DOMAIN = "dev-ole6i03kzvf3yb8z.us.auth0.com"
AUTH0_AUDIENCE = "https://civicresolve.example/api"
ELEVENLABS_AGENT_ID = "agent_5801m3fcxxsfez68g5v7gr22fzky"

[env.production.vars]
APP_ENV = "production"
DEV_AUTH_ENABLED = "false"
ALLOWED_ORIGINS = "https://envoy.surf,https://envoy.matteopolak.workers.dev"
AUTH0_DOMAIN = "dev-ole6i03kzvf3yb8z.us.auth0.com"
AUTH0_AUDIENCE = "https://civicresolve.example/api"
ELEVENLABS_AGENT_ID = "agent_5801m3fcxxsfez68g5v7gr22fzky"
THEME_AI_ENABLED = "true"
THEME_AI_NO_CHARGE_CONFIRMED = "true"

[env.production]
name = "envoy"
compatibility_flags = ["nodejs_compat"]

[[env.production.routes]]
pattern = "envoy.surf"
custom_domain = true

[env.production.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[env.production.ai]
binding = "AI"

[[env.production.vectorize]]
binding = "THEME_VECTORS"
index_name = "envoy-feedback-themes"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "d9c7e05b5ab547be9355ac1e0085dae6"

[env.production.triggers]
crons = ["*/5 * * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "civicresolve-prod"
database_id = "63318ca9-4000-4713-b72e-364429251d21"
migrations_dir = "../../packages/db/migrations"

[[env.production.r2_buckets]]
binding = "PRIVATE_ASSETS"
bucket_name = "civicresolve-private-prod"

[[d1_databases]]
binding = "DB"
database_name = "civicresolve-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "PRIVATE_ASSETS"
bucket_name = "civicresolve-private-local"
